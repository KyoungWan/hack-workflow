<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSV 탐색기</title></head><body><aside><button id="toggle-sidebar" class="sidebar-toggle" type="button" aria-label="CSV 메뉴 접기" title="CSV 메뉴 접기" aria-expanded="true" aria-controls="sidebar-content">‹</button><div id="sidebar-content"><h1>CSV 탐색기</h1><p>제공 데이터를 읽기 편하게</p><nav id="files" aria-label="CSV 파일 목록"></nav></div></aside><main><header class="explorer-header"><h2 id="title">파일을 선택하세요</h2><p id="status" role="status"></p><button type="button" id="maximize-table" class="maximize-table" aria-pressed="false" title="메뉴와 검색 영역을 숨기고 표 크게 보기">표 최대화</button></header><form id="query"><label>전체 검색<input id="search" placeholder="예: L037, L043" title="전체 열 검색 · 쉼표로 나눈 값 중 하나라도 포함하면 표시"></label><section class="conditions"><div class="condition-heading">필터 <small>행끼리 AND · 쉼표는 OR</small><button type="button" id="add-filter" class="add" aria-label="필터 추가" title="필터 추가">+</button></div><div id="filters"></div></section><section class="conditions"><div class="condition-heading">정렬 <small>최대 3순위</small><button type="button" id="add-sort" class="add" aria-label="정렬 기준 추가" title="정렬 기준 추가">+</button></div><div id="sorts"></div></section><button>적용</button><button type="button" id="reset">초기화</button></form><div id="error" role="alert"></div><div class="table-wrap"><table id="table"></table></div><footer><button id="prev">이전</button><span id="page"></span><button id="next">다음</button><label>페이지당 행<select id="size"><option>50</option><option>100</option><option>250</option></select></label></footer><div id="notice" class="copy-notice" role="status" aria-live="polite" hidden></div></main><script type="module" src="/src/client.ts"></script></body></html>
